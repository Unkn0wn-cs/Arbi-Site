<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nocturne-463e0dc1-8fad-4a8f-b830-c6d6be16875f/styles.css">
<link rel="stylesheet" href="arbi-palette.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<script src="_ds/nocturne-463e0dc1-8fad-4a8f-b830-c6d6be16875f/_ds_bundle.js"></script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
</helmet>
<div style="background:radial-gradient(ellipse 70% 90% at 15% 100%,var(--color-accent-900),transparent 70%)">
  <sc-if value="{{ cta }}" hint-placeholder-val="{{ true }}">
    <section data-screen-label="CTA final" style="padding:clamp(56px,7vw,96px) clamp(20px,5vw,64px) clamp(36px,4vw,56px)">
      <div style="max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:32px">
        <div style="display:flex;flex-direction:column;gap:16px;flex:1 1 420px;min-width:0">
          <h2 style="margin:0;font-size:clamp(48px,7vw,104px);line-height:0.9;letter-spacing:-0.045em;font-weight:500"><span style="color:transparent;-webkit-text-stroke:1.5px var(--color-accent)">JOIN</span><br>ROBOTICS!</h2>
          <p style="margin:0;font-size:clamp(16px,1.6vw,19px);line-height:1.5;color:var(--color-neutral-200);max-width:440px;text-wrap:pretty">Inscripciones abiertas en octubre. Sin experiencia previa, de cualquier carrera.</p>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;flex:0 1 300px;min-width:240px">
          <a href="Join Robotics.dc.html#unete" class="btn btn-primary btn-block" style="font-size:17px;padding:14px 24px;white-space:nowrap;justify-content:center">Inscríbete · 2 min →</a>
          <a href="Join Robotics.dc.html#faq" class="btn btn-secondary btn-block" style="font-size:15px;padding:11px 24px;white-space:nowrap;justify-content:center">Preguntas frecuentes</a>
        </div>
      </div>
    </section>
  </sc-if>
  <footer style="padding:16px clamp(20px,5vw,64px) max(16px,calc(160px - 16vw));background:linear-gradient(to right,transparent,var(--color-divider) 48px,var(--color-divider) calc(100% - 48px),transparent) top / 100% 1px no-repeat">
    <div style="max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 24px;font-size:13px">
      <span style="display:flex;align-items:center;gap:8px;color:var(--color-neutral-300)"><span style="width:7px;height:7px;border-radius:2px;background:var(--color-accent);box-shadow:0 0 8px var(--color-accent)"></span><b style="color:var(--color-text);font-weight:500">Arbi</b> · Robótica competitiva · Universidad Metropolitana</span>
      <div style="display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center">
        <a href="Quienes Somos.dc.html" style="color:var(--color-neutral-300);text-decoration:none" style-hover="color:var(--color-accent)">Quiénes somos</a>
        <a href="Trayectoria.dc.html" style="color:var(--color-neutral-300);text-decoration:none" style-hover="color:var(--color-accent)">Trayectoria</a>
        <a href="Blog.dc.html" style="color:var(--color-neutral-300);text-decoration:none" style-hover="color:var(--color-accent)">Blog</a>
      </div>
      <div style="display:flex;gap:2px">
        <a href="https://instagram.com/" target="_blank" class="btn btn-ghost btn-icon" aria-label="Instagram" style="min-width:40px;min-height:40px;font-size:18px"><i class="ph ph-instagram-logo"></i></a>
        <a href="#" class="btn btn-ghost btn-icon" aria-label="WhatsApp" style="min-width:40px;min-height:40px;font-size:18px"><i class="ph ph-whatsapp-logo"></i></a>
        <a href="#" class="btn btn-ghost btn-icon" aria-label="Discord" style="min-width:40px;min-height:40px;font-size:18px"><i class="ph ph-discord-logo"></i></a>
        <a href="#" class="btn btn-ghost btn-icon" aria-label="Email" style="min-width:40px;min-height:40px;font-size:18px"><i class="ph ph-envelope-simple"></i></a>
      </div>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;cta&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() { return { cta: this.props.cta !== false }; }
}
</script>
</body>
</html>
