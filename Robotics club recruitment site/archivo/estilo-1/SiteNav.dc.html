<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nocturne-463e0dc1-8fad-4a8f-b830-c6d6be16875f/styles.css">
<script src="_ds/nocturne-463e0dc1-8fad-4a8f-b830-c6d6be16875f/_ds_bundle.js"></script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>@keyframes wordin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</helmet>
<div>
  <nav style="position:fixed;top:0;left:0;right:0;z-index:50;padding:14px clamp(20px,4vw,48px);display:flex;align-items:center;gap:clamp(16px,2.4vw,28px);transition:background .3s ease;background:{{ navBg }};backdrop-filter:{{ navBlur }};-webkit-backdrop-filter:{{ navBlur }}">
    <a href="{{ homeHref }}" style="margin-right:auto;display:flex;align-items:center;gap:10px;font-size:20px;font-weight:500;letter-spacing:-0.02em;color:var(--color-text);text-decoration:none">
      <span style="width:10px;height:10px;border-radius:2px;background:var(--color-accent);box-shadow:0 0 12px var(--color-accent)"></span>Arbi
    </a>
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
        <sc-if value="{{ l.on }}" hint-placeholder-val="{{ false }}"><a href="{{ l.href }}" aria-current="page" style="font-size:14px;color:var(--color-accent);text-decoration:none">{{ l.label }}</a></sc-if>
        <sc-if value="{{ l.off }}" hint-placeholder-val="{{ true }}"><a href="{{ l.href }}" style="font-size:14px;color:var(--color-neutral-200);text-decoration:none" style-hover="color:var(--color-accent)">{{ l.label }}</a></sc-if>
      </sc-for>
    </sc-if>
    <a href="{{ joinHref }}" class="btn btn-primary" style="padding:9px 18px;font-size:14px">Únete</a>
    <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
      <button type="button" class="btn btn-ghost btn-icon" onClick="{{ toggle }}" aria-label="Menú" style="min-width:44px;min-height:44px;font-size:22px;color:var(--color-text)"><i class="{{ menuIcon }}"></i></button>
    </sc-if>
  </nav>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;top:72px;left:0;right:0;z-index:49;padding:8px clamp(20px,4vw,48px) 24px;background:color-mix(in srgb,var(--color-bg) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;animation:wordin .25s ease-out">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
        <a href="{{ l.href }}" onClick="{{ close }}" style="padding:14px 0;font-size:22px;letter-spacing:-0.01em;color:var(--color-text);text-decoration:none;background:linear-gradient(to right,var(--color-divider),transparent) bottom / 100% 1px no-repeat">{{ l.label }}</a>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{ showBar }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;left:0;right:0;bottom:0;z-index:48;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--color-bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;gap:12px;animation:wordin .3s ease-out">
      <div style="display:flex;flex-direction:column;flex:1;min-width:0"><span style="font-size:14px;font-weight:500">Inscripciones abiertas</span><span class="text-muted" style="font-size:12px">Sin experiencia · 2 minutos</span></div>
      <a href="{{ joinHref }}" class="btn btn-primary" style="padding:12px 18px;font-size:15px;min-height:44px;display:inline-flex;align-items:center">Inscríbete →</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;quienes&quot;,&quot;trayectoria&quot;,&quot;blog&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { scrolled: false, narrow: window.innerWidth < 900, open: false, bar: false };
  componentDidMount() {
    this.onScroll = () => {
      const y = window.scrollY;
      const f = document.getElementById('unete');
      let inForm = false;
      if (f) { const r = f.getBoundingClientRect(); inForm = r.top < window.innerHeight && r.bottom > 0; }
      const scrolled = y > 24, bar = y > 480 && !inForm;
      if (scrolled !== this.state.scrolled || bar !== this.state.bar) this.setState({ scrolled, bar });
    };
    this.onResize = () => { const n = window.innerWidth < 900; if (n !== this.state.narrow) this.setState({ narrow: n, open: false }); };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('resize', this.onResize);
    this.onScroll();
    const q = new URLSearchParams(location.search);
    if (q.get('reveal') !== '0' && 'IntersectionObserver' in window) {
      this.io = new IntersectionObserver(es => es.forEach(e => {
        if (!e.isIntersecting) return;
        const el = e.target;
        if (el.hasAttribute('data-draw')) el.style.transform = 'scaleX(1)';
        else { el.style.opacity = '1'; el.style.transform = 'none'; }
        this.io.unobserve(el);
      }), { threshold: 0.1 });
      setTimeout(() => {
        document.querySelectorAll('[data-reveal]').forEach(el => {
          const d = (parseInt(el.getAttribute('data-reveal')) || 0) * 80;
          el.style.opacity = '0'; el.style.transform = 'translateY(24px)';
          el.style.transition = `opacity .6s ease ${d}ms, transform .6s cubic-bezier(.2,.7,.2,1) ${d}ms`;
          this.io.observe(el);
        });
        document.querySelectorAll('[data-draw]').forEach(el => {
          el.style.transformOrigin = el.getAttribute('data-draw') === 'y' ? 'top' : 'left';
          el.style.transform = el.getAttribute('data-draw') === 'y' ? 'scaleY(0)' : 'scaleX(0)';
          el.style.transition = 'transform 1.4s cubic-bezier(.6,0,.2,1) .3s';
          this.io.observe(el);
        });
      }, 60);
    }
  }
  componentWillUnmount() {
    window.removeEventListener('scroll', this.onScroll);
    window.removeEventListener('resize', this.onResize);
    if (this.io) this.io.disconnect();
  }
  renderVals() {
    const a = this.props.active || 'home', home = a === 'home';
    const H = 'Join Robotics.dc.html';
    const st = this.state, solid = st.scrolled || st.open;
    const links = [['quienes', 'Quiénes somos', 'Quienes Somos.dc.html'], ['trayectoria', 'Trayectoria', 'Trayectoria.dc.html'], ['blog', 'Blog', 'Blog.dc.html'], ['faq', 'FAQ', home ? '#faq' : H + '#faq']];
    return {
      links: links.map(([k, label, href]) => ({ label, href, on: k === a, off: k !== a })),
      wide: !st.narrow, narrow: st.narrow,
      homeHref: home ? '#' : H,
      joinHref: home ? '#unete' : H + '#unete',
      navBg: solid ? 'color-mix(in srgb,var(--color-bg) 82%,transparent)' : 'transparent',
      navBlur: solid ? 'blur(14px)' : 'none',
      open: st.open,
      menuIcon: st.open ? 'ph ph-x' : 'ph ph-list',
      toggle: () => this.setState(s => ({ open: !s.open })),
      close: () => this.setState({ open: false }),
      showBar: st.narrow && st.bar && !st.open
    };
  }
}
</script>
</body>
</html>
